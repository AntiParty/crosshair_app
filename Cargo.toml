[package]
name = "finals_crosshair"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Design, preview, save and apply THE FINALS crosshairs (unofficial)."
license = "MIT"
publish = false

[workspace]
members = ["core"]
resolver = "3"

[dependencies]
finals_crosshair_core = { path = "core" }
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
